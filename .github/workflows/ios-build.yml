name: MaskPad iOS build

# Required ROM-free proof for the sole project repository. Upstream source
# trees are pinned build inputs and this workflow never publishes to them.

on:
  # No pull_request trigger: a branch is already built (workflow_dispatch) before it is merged, and the
  # merge itself builds main. GitHub disabled Actions on this fork once after heavy macOS usage.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to build: github (hosted macOS) or mac (Mati's Mac, self-hosted runner)"
        type: choice
        options: [github, mac]
        default: github

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check assets, history, scripts, patches, links, and credentials
        run: scripts/check-repo-safety.sh

      - name: Verify SDL patches apply fresh and re-apply on a cached checkout
        run: scripts/check-sdl-patches.sh

  ios-build:
    name: Full app (unsigned iPhoneOS)
    runs-on: ${{ inputs.runner == 'mac' && fromJSON('["self-hosted","macOS","ARM64","mati-mac"]') || 'macos-15' }}
    timeout-minutes: 120
    needs: repository-safety

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: ${{ inputs.runner != 'mac' }}

      # On the Mac the sources and build folders are reused between builds: return the pinned sources to
      # their committed state so this branch's patches apply from scratch, and drop old packages.
      - name: Reset reused sources (Mac runner)
        if: inputs.runner == 'mac'
        run: |
          rm -rf artifacts
          if [ -d sources ]; then
            for repo in sources/*/; do
              [ -d "$repo/.git" ] || continue
              git -C "$repo" reset -q --hard
              git -C "$repo" clean -qffdx
              git -C "$repo" submodule foreach --recursive 'git reset -q --hard && git clean -qffdx'
            done
          fi

      - name: Select the newest installed Xcode
        if: inputs.runner != 'mac'
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install host archive-build dependencies
        if: inputs.runner != 'mac'
        run: >-
          brew install cmake ninja pkgconf sdl2 glew nlohmann-json libpng
          libzip tinyxml2 libogg libvorbis opus opusfile sdl2_net

      - name: Cache host and iOS dependencies
        if: inputs.runner != 'mac'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build-host/_deps
            build-ios-device/_deps
          key: maskpad-ios-${{ runner.os }}-${{ hashFiles('patches/**', 'port/**', 'scripts/*.sh') }}

      - name: Reconstruct pinned source
        run: |
          scripts/clone-sources.sh
          scripts/apply-patches.sh

      - name: Test SDL2 controller reconciliation
        run: scripts/test-controller-reconnect.sh

      - name: Reproduce unsigned arm64 iPhoneOS app
        run: |
          set -o pipefail
          scripts/configure-ios.sh --device 2>&1 | tee -a build.log
          scripts/build-ios.sh --device 2>&1 | tee -a build.log

      # Build logs are not always downloadable; surface compiler and CMake errors as annotations.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|CMake Error|fatal error|Undefined symbol|ld: " build.log | sort -u | head -120 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          split -l 12 errors.txt chunk.
          for f in chunk.*; do
            msg="$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Build errors ($f)::$msg"
          done

      - name: Package and audit unsigned IPA
        run: |
          scripts/package-unsigned-ipa.sh
          scripts/verify-release.sh

      # Personal test build: a workflow artifact, not a release.
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MaskPad-unsigned-ipa
          path: artifacts/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  simulator-tests:
    name: ROM-free Simulator UI
    # The Simulator needs a logged-in GUI session, which the Mac runner's user does not have: UI tests stay
    # on GitHub (they also run on every push to main).
    if: inputs.runner != 'mac'
    runs-on: macos-15
    timeout-minutes: 120
    needs: repository-safety

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: ${{ inputs.runner != 'mac' }}

      # On the Mac the sources and build folders are reused between builds: return the pinned sources to
      # their committed state so this branch's patches apply from scratch, and drop old packages.
      - name: Reset reused sources (Mac runner)
        if: inputs.runner == 'mac'
        run: |
          rm -rf artifacts
          if [ -d sources ]; then
            for repo in sources/*/; do
              [ -d "$repo/.git" ] || continue
              git -C "$repo" reset -q --hard
              git -C "$repo" clean -qffdx
              git -C "$repo" submodule foreach --recursive 'git reset -q --hard && git clean -qffdx'
            done
          fi

      - name: Select the newest installed Xcode
        if: inputs.runner != 'mac'
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install host archive-build dependencies
        if: inputs.runner != 'mac'
        run: >-
          brew install cmake ninja pkgconf sdl2 glew nlohmann-json libpng
          libzip tinyxml2 libogg libvorbis opus opusfile sdl2_net

      - name: Cache host and Simulator dependencies
        if: inputs.runner != 'mac'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build-host/_deps
            build-ios-simulator/_deps
          key: maskpad-simulator-${{ runner.os }}-${{ hashFiles('patches/**', 'port/**', 'scripts/*.sh') }}

      - name: Reconstruct pinned source
        run: |
          scripts/clone-sources.sh
          scripts/apply-patches.sh

      - name: Test SDL2 controller reconciliation
        run: scripts/test-controller-reconnect.sh

      - name: Select an available iPad Simulator
        id: simulator
        run: |
          udid="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )["devices"]
          candidates = [
              device["udid"]
              for runtime in devices.values()
              for device in runtime
              if device.get("isAvailable") and device["name"].startswith("iPad")
          ]
          if not candidates:
              raise SystemExit("No available iPad Simulator found")
          print(candidates[0])
          PY
          )"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run ROM-free touch and layout tests
        run: scripts/test-ios-ui.sh "${{ steps.simulator.outputs.udid }}"
